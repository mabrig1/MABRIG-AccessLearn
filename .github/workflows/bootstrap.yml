name: Bootstrap AccessLearn application
on:
  push:
    paths: ['.bootstrap/READY']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack application
        shell: bash
        run: |
          set -euo pipefail
          test -s .bootstrap/READY
          cat .bootstrap/part-* | base64 --decode > /tmp/accesslearn.tar.xz
          tar --list -Jf /tmp/accesslearn.tar.xz > /tmp/accesslearn-files.txt
          if grep -E '(^/|(^|/)\.\./)' /tmp/accesslearn-files.txt; then
            echo 'Unsafe archive entry'; exit 1
          fi
          tar --extract --xz --file=/tmp/accesslearn.tar.xz --directory=.
          rm -rf .bootstrap
      - name: Publish source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish AccessLearn MVP application source"
            git push
          fi
