name: Bootstrap AccessLearn application
on:
  push:
    paths:
      - '.bootstrap/accesslearn.tar.xz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack AccessLearn source
        shell: bash
        run: |
          set -euo pipefail
          test -s .bootstrap/accesslearn.tar.xz.b64
          base64 --decode .bootstrap/accesslearn.tar.xz.b64 > /tmp/accesslearn.tar.xz
          tar --list -Jf /tmp/accesslearn.tar.xz | head -30
          tar --extract --xz --file=/tmp/accesslearn.tar.xz --directory=.
          rm -rf .bootstrap
      - name: Commit application source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish AccessLearn MVP application source"
            git push
          fi
